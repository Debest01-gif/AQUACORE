services:
  - type: web
    name: AQUACORE-mis
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_NAME
        value: "AQUACORE MIS"
      - key: DB_CONNECTION
        value: "sqlite"
      - key: APP_TIMEZONE
        value: "Africa/Nairobi"
